name: Validate WeatherZilla
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: dotnet build WeatherZilla.WebApp/WeatherZilla.WebApp.csproj -c Release
      - run: dotnet build WeatherZilla.WebAPI/WeatherZilla.WebAPI.csproj -c Release
      - run: dotnet run --project tests/FavoritesSmoke/FavoritesSmoke.csproj -c Release
      - run: npm ci --prefix tests/validation
      - run: npm test --prefix tests/validation
